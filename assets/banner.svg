<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090D16"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#070A10"/></linearGradient><radialGradient id="meshGlow1" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#4F46E5" stop-opacity=".35"/><stop offset="100%" stop-color="#090D16" stop-opacity="0"/></radialGradient><radialGradient id="meshGlow2" cx="85%" cy="70%" r="55%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".25"/><stop offset="100%" stop-color="#090D16" stop-opacity="0"/></radialGradient><radialGradient id="meshGlow3" cx="50%" cy="85%" r="40%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".2"/><stop offset="100%" stop-color="#090D16" stop-opacity="0"/></radialGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1E293B" stop-opacity=".85"/><stop offset="100%" stop-color="#0F172A" stop-opacity=".95"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#38BDF8"/></linearGradient><linearGradient id="accentLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/><stop offset="50%" stop-color="#8B5CF6" stop-opacity="1"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/></linearGradient><filter id="shadowFilter" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter><filter id="glowFilter" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseFlow{0%{stroke-dashoffset:120}}@keyframes floatSlow1{0%{transform:translateY(0)}50